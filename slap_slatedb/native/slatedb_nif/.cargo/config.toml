# Link settings for building the NIF as a shared library that the BEAM loads.

# musl targets link the C runtime statically by default, which a shared
# library loaded into the BEAM cannot do.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]

# On macOS the enif_* symbols come from the BEAM at load time, so leave them
# undefined when linking.
[target.'cfg(target_os = "macos")']
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]
