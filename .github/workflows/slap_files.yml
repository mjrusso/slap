name: slap_files

on:
  push:
    paths:
      - "slap_files/**"
      - "slap_kv/**"
      - "slap_cluster/**"
      - "slap_slatedb/**"
      - ".github/workflows/slap_files.yml"
  pull_request:
    paths:
      - "slap_files/**"
      - "slap_kv/**"
      - "slap_cluster/**"
      - "slap_slatedb/**"
      - ".github/workflows/slap_files.yml"

defaults:
  run:
    working-directory: slap_files

env:
  MIX_ENV: test
  SLAP_LOCAL_DEPS: "1"
  SLAP_SLATEDB_BUILD: "1"
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Files Checks
    runs-on: ubuntu-24.04
    env:
      # More model-based sequences than the local default.
      SLAP_FILES_PROP_RUNS: "500"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: slap_slatedb/native/slatedb_nif
      - run: mix deps.get
      # Dialyzer's PLTs take minutes to build; they depend on the runtime
      # and the dependencies.
      - name: Cache Dialyzer PLTs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            slap_files/_build/test/*.plt
            slap_files/_build/test/*.plt.hash
            ~/.mix/*.plt
            ~/.mix/*.plt.hash
          key: plt-slap_files-${{ runner.os }}-otp29-elixir1.20-${{ hashFiles('slap_files/mix.exs', 'slap_files/mix.lock', 'slap_kv/mix.exs', 'slap_slatedb/mix.exs', 'slap_cluster/mix.exs') }}
          restore-keys: plt-slap_files-${{ runner.os }}-otp29-elixir1.20-
      - run: mix check
