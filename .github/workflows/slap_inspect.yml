name: slap_inspect

on:
  push:
    paths:
      - "slap_inspect/**"
      - ".github/workflows/slap_inspect.yml"
  pull_request:
    paths:
      - "slap_inspect/**"
      - ".github/workflows/slap_inspect.yml"

defaults:
  run:
    working-directory: slap_inspect

env:
  MIX_ENV: test

jobs:
  test:
    name: Inspect Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - run: mix deps.get
      # Dialyzer's PLTs take minutes to build; they depend on the runtime
      # and the dependencies.
      - name: Cache Dialyzer PLTs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            slap_inspect/_build/test/*.plt
            slap_inspect/_build/test/*.plt.hash
            ~/.mix/*.plt
            ~/.mix/*.plt.hash
          key: plt-slap_inspect-${{ runner.os }}-otp29-elixir1.20-${{ hashFiles('slap_inspect/mix.exs', 'slap_inspect/mix.lock') }}
          restore-keys: plt-slap_inspect-${{ runner.os }}-otp29-elixir1.20-
      - run: mix check
      - name: Build the executable
        run: |
          MIX_ENV=prod mix deps.get --only prod
          MIX_ENV=prod mix escript.build
      - name: Check executable help
        run: ./slap-inspect --help
