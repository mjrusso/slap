# The official Durable Streams benchmarks against slap and the Caddy server,
# on one runner so that their results are comparable.
#
# The official suite runs few iterations and shared runners are noisy:
# alerts do not fail the job.
name: slap_streams Benchmarks

on:
  push:
    paths:
      - "slap/**"
      - "slap_streams/**"
      - "slap_cluster/**"
      - "slap_slatedb/**"
      - ".github/workflows/slap_streams_bench.yml"
  workflow_dispatch:

permissions:
  # To push results to gh-pages and comment on commits, on main.
  contents: write

concurrency:
  group: slap_streams-bench-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: slap

env:
  MIX_ENV: dev
  SLAP_LOCAL_DEPS: "1"
  SLAP_SLATEDB_BUILD: "1"
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: HTTP Comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Start RustFS 1.0.0
        working-directory: .
        run: |
          docker run -d --name rustfs -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=rustfsadmin -e RUSTFS_SECRET_KEY=rustfsadmin \
            rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
          # RustFS answers before it can create buckets: retry until the
          # bucket exists.
          s3() { curl -sf -o /dev/null --aws-sigv4 "aws:amz:us-east-1:s3" \
            --user rustfsadmin:rustfsadmin "$@" http://127.0.0.1:9000/slap-streams-bench; }
          for i in $(seq 1 30); do
            s3 -X PUT || true; s3 -I && break; sleep 1
          done
          s3 -I
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: slap_slatedb/native/slatedb_nif
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: corepack enable
      - run: mix deps.get
      - name: Run the benchmarks
        env:
          AWS_ENDPOINT: http://127.0.0.1:9000
          AWS_ALLOW_HTTP: "true"
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: rustfsadmin
          AWS_SECRET_ACCESS_KEY: rustfsadmin
          SLAP_BENCH_S3_URL: s3://slap-streams-bench/ci
        run: scripts/streams_bench.sh bench/results slap-local slap-s3 caddy-file
      - name: Summary
        working-directory: slap/durable_streams
        run: node summary.js ../bench/results >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: slap_streams-bench-${{ github.sha }}
          path: slap/bench/results

      # Main: results go to gh-pages. github-action-benchmark needs the
      # branch to exist, so create it (one empty commit) on the first run,
      # without changing the checkout that the later steps use.
      - name: Create the gh-pages branch
        if: github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            empty_tree=$(git hash-object -t tree /dev/null)
            commit=$(git commit-tree "$empty_tree" -m "Start gh-pages for benchmark results")
            git push origin "$commit:refs/heads/gh-pages"
          fi
      - name: Store results (lower is better)
        if: github.ref == 'refs/heads/main'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Durable Streams (lower is better)
          tool: customSmallerIsBetter
          output-file-path: slap/bench/results/smaller.json
          benchmark-data-dir-path: dev/streams-bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "150%"
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true
      - name: Store results (higher is better)
        if: github.ref == 'refs/heads/main'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Durable Streams (higher is better)
          tool: customBiggerIsBetter
          output-file-path: slap/bench/results/bigger.json
          benchmark-data-dir-path: dev/streams-bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "150%"
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true

      # Other branches: compare with this branch's previous run, from the
      # Actions cache. Nothing is pushed.
      - name: Restore previous results
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v5
        with:
          path: bench-data
          key: slap_streams-bench-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: slap_streams-bench-${{ github.ref_name }}-
      - if: github.ref != 'refs/heads/main'
        working-directory: .
        run: mkdir -p bench-data
      - name: Compare (lower is better)
        if: github.ref != 'refs/heads/main'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Durable Streams (lower is better)
          tool: customSmallerIsBetter
          output-file-path: slap/bench/results/smaller.json
          external-data-json-path: bench-data/benchmark-data.json
          alert-threshold: "150%"
          fail-on-alert: false
          summary-always: true
      - name: Compare (higher is better)
        if: github.ref != 'refs/heads/main'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Durable Streams (higher is better)
          tool: customBiggerIsBetter
          output-file-path: slap/bench/results/bigger.json
          external-data-json-path: bench-data/benchmark-data.json
          alert-threshold: "150%"
          fail-on-alert: false
          summary-always: true
      - name: Save results
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: bench-data
          key: slap_streams-bench-${{ github.ref_name }}-${{ github.run_id }}
