name: slap_yjs

on:
  push:
    paths:
      - "slap_yjs/**"
      - "slap_streams/**"
      - "slap_snapshot_log/**"
      - "slap_cluster/**"
      - "slap_slatedb/**"
      - ".github/workflows/slap_yjs.yml"
  pull_request:
    paths:
      - "slap_yjs/**"
      - "slap_streams/**"
      - "slap_snapshot_log/**"
      - "slap_cluster/**"
      - "slap_slatedb/**"
      - ".github/workflows/slap_yjs.yml"

defaults:
  run:
    working-directory: slap_yjs

env:
  MIX_ENV: test
  SLAP_LOCAL_DEPS: "1"
  SLAP_SLATEDB_BUILD: "1"
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Yjs Checks
    runs-on: ubuntu-24.04
    env:
      # The @tag :s3 tests run against RustFS.
      SLAP_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      SLAP_TEST_S3_BUCKET: yjs-store
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Start RustFS 1.0.0
        working-directory: .
        run: |
          docker run -d --name rustfs -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=rustfsadmin -e RUSTFS_SECRET_KEY=rustfsadmin \
            rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
          # RustFS answers before it can create buckets: retry until the
          # bucket exists.
          s3() { curl -sf -o /dev/null --aws-sigv4 "aws:amz:us-east-1:s3" \
            --user rustfsadmin:rustfsadmin "$@" http://127.0.0.1:9000/yjs-store; }
          for i in $(seq 1 30); do
            s3 -X PUT || true; s3 -I && break; sleep 1
          done
          s3 -I
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: slap_slatedb/native/slatedb_nif
      - run: mix deps.get
      # Dialyzer's PLTs take minutes to build; they depend on the runtime
      # and the dependencies.
      - name: Cache Dialyzer PLTs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            slap_yjs/_build/test/*.plt
            slap_yjs/_build/test/*.plt.hash
            ~/.mix/*.plt
            ~/.mix/*.plt.hash
          key: plt-slap_yjs-${{ runner.os }}-otp29-elixir1.20-${{ hashFiles('slap_yjs/mix.exs', 'slap_yjs/mix.lock', 'slap_snapshot_log/mix.exs', 'slap_streams/mix.exs', 'slap_slatedb/mix.exs', 'slap_cluster/mix.exs') }}
          restore-keys: plt-slap_yjs-${{ runner.os }}-otp29-elixir1.20-
      - run: mix check
