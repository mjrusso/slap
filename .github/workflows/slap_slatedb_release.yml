# Builds the slap_slatedb NIF for every target and NIF version, and attaches
# the libraries to the GitHub release for tag `slap_slatedb-v<version>`.
# rustler_precompiled downloads them from there. See RELEASING.md.
name: slap_slatedb Release

on:
  push:
    tags:
      - "slap_slatedb-v*"

permissions:
  contents: write

jobs:
  build:
    name: NIF ${{ matrix.nif }} (${{ matrix.job.target }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with Slap.SlateDB.Native (lib/slap/slatedb/native.ex).
        nif: ["2.15"]
        job:
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
          # The Linux builds use `cross`, whose images have complete musl
          # toolchains and older glibc versions than the runner, so the gnu
          # libraries load on older distributions too.
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04, use-cross: true }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, use-cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04, use-cross: true }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, use-cross: true }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Read the version from the tag
        shell: bash
        run: echo "PROJECT_VERSION=${GITHUB_REF_NAME#slap_slatedb-v}" >> "$GITHUB_ENV"
      - name: Check that the tag matches mix.exs
        shell: bash
        run: grep -q "@version \"${PROJECT_VERSION}\"" slap_slatedb/mix.exs
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.job.target }}
      - uses: philss/rustler-precompiled-action@853ac56183f29a080304df3ff8a194b5bbdc24cc # v1.1.4
        id: build-crate
        with:
          project-name: slatedb_nif
          project-version: ${{ env.PROJECT_VERSION }}
          project-dir: slap_slatedb/native/slatedb_nif
          target: ${{ matrix.job.target }}
          nif-version: ${{ matrix.nif }}
          use-cross: ${{ matrix.job.use-cross }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.build-crate.outputs.file-name }}
          path: ${{ steps.build-crate.outputs.file-path }}
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: ${{ steps.build-crate.outputs.file-path }}
