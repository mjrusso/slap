# Five nodes and RustFS (the shared object store) for the Jepsen suite.
# Nodes are named by their addresses, which the suite uses as Jepsen and
# Erlang node names. RustFS is not a Jepsen node: partitions leave it
# reachable, as S3 would be.
name: slap-jepsen

networks:
  jepsen:
    ipam:
      config:
        - subnet: 10.47.0.0/24

x-node: &node
  image: slap-jepsen-node
  init: true
  cap_add: [NET_ADMIN]
  depends_on:
    bucket:
      condition: service_completed_successfully

services:
  rustfs:
    image: rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    networks:
      jepsen:
        ipv4_address: 10.47.0.2

  # RustFS answers before it can create buckets: retry until the bucket
  # exists.
  bucket:
    image: curlimages/curl:8.22.0
    depends_on: [rustfs]
    entrypoint: ["sh", "-c"]
    command:
      - |
        s3() { curl -sf -o /dev/null --aws-sigv4 aws:amz:us-east-1:s3 --user rustfsadmin:rustfsadmin "$$@" http://10.47.0.2:9000/jepsen; }
        for i in $$(seq 1 60); do s3 -X PUT || true; s3 -I && exit 0; sleep 1; done
        exit 1
    networks: [jepsen]

  n1:
    <<: *node
    networks:
      jepsen:
        ipv4_address: 10.47.0.11
  n2:
    <<: *node
    networks:
      jepsen:
        ipv4_address: 10.47.0.12
  n3:
    <<: *node
    networks:
      jepsen:
        ipv4_address: 10.47.0.13
  n4:
    <<: *node
    networks:
      jepsen:
        ipv4_address: 10.47.0.14
  n5:
    <<: *node
    networks:
      jepsen:
        ipv4_address: 10.47.0.15
